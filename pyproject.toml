[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "req-multiagent"
version = "0.1.0"
description = "Multi-agent Requirements Engineering assistant built with Agno."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno>=1.4.0",
    "chromadb>=0.5.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
